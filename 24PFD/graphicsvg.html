<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24PFD</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Resolve cockpit lighting mode before first paint to avoid a flash of the wrong mode
  (function () {
    var stored = localStorage.getItem("lighting");
    var mode = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day");
    document.documentElement.setAttribute("data-theme", mode);
  })();
</script>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="title-block">
      <h1 class="app-title">24PFD</h1>
      <p class="app-subtitle">Primary Flight Display</p>
    </div>
    <button id="lightingToggle" class="lighting-toggle" aria-label="Toggle panel lighting" onclick="toggleLighting()">
      <span class="lighting-toggle-label" id="dayLabel">DAY</span>
      <span class="lighting-toggle-track"><span class="thumb"></span></span>
      <span class="lighting-toggle-label" id="nightLabel">NIGHT</span>
    </button>
  </header>

  <div class="layout">
    <aside class="panel">
      <h3>Select aircraft</h3>

      <label for="callsignSelect">Callsign</label>
      <select id="callsignSelect" class="custom-select" onchange="setCallsign()">
        <option value="" disabled selected>SELECT</option>
      </select>
    </aside>

    <main class="pfd-frame">
      <svg width="100%" height="auto" viewBox="-400 -400 880 800">

    <g id="attitude">

      <!-- Himmel -->
      <rect x="-800" y="-800" width="1600" height="800" fill="skyblue"/>

      <!-- Mark -->
      <rect x="-800" y="0" width="1600" height="800" fill="sienna"/>

      <!-- Horisont -->
      <line x1="-800" y1="0" x2="800" y2="0"
            stroke="white" stroke-width="5"/>

      <!-- Pitch marks -->
      <g id="pitch_marks">
        <line x1="-170" y1="-50" x2="170" y2="-50" stroke="white"
        stroke-width="5"/>
        <line x1="-130" y1="-100" x2="130" y2="-100" stroke="white"
        stroke-width="5"/>
        <line x1="-200" y1="150" x2="200" y2="150" stroke="white"
        stroke-width="5"/>
        <line x1="-200" y1="-150" x2="200" y2="-150" stroke="white"
        stroke-width="5"/>
        <line x1="-170" y1="50" x2="170" y2="50" stroke="white"
        stroke-width="5"/>
        <line x1="-130" y1="100" x2="130" y2="100" stroke="white"
          stroke-width="5"/>
      </g>

    </g>
    <g id ="airplane_symbol">
      <line x1="-100" y1="0" x2="-10" y2="0" stroke="yellow"
        stroke-width="5"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="yellow"
        stroke-width="5"/>
        <line x1="100" y1="0" x2="10" y2="0" stroke="yellow"
        stroke-width="5"/>
    </g>

    <!-- Speed Tape (Left) -->
    <g id="speed_group" transform="translate(-390, -300)">
      <rect x="0" y="0" width="80" height="600" fill="#333" fill-opacity="0.8"/>
      <!-- Red bar for low speed indicator -->
      <!--<rect x="0" y="0" width="10" height="600" fill="red"/>-->
      
      <clipPath id="speed_clip">
        <rect x="0" y="0" width="80" height="600"/>
      </clipPath>
      
      <g clip-path="url(#speed_clip)">
        <g id="speed_tape" transform="translate(0, 300)">
          <!-- Tick marks generated by JS -->
        </g>
      </g>
      
      <!-- Center pointer -->
      <polygon points="10,280 60,280 80,300 60,320 10,320" fill="black" stroke="cyan" stroke-width="2"/>
      <text id="speed_text" x="35" y="308" fill="white" font-size="20" font-weight="bold" text-anchor="middle">0</text>
    </g>

    <!-- Alt Tape (Right) -->
    <g id="alt_group" transform="translate(310, -300)">
      <rect x="0" y="0" width="80" height="600" fill="#333" fill-opacity="0.8"/>
      
      <clipPath id="alt_clip">
        <rect x="0" y="0" width="80" height="600"/>
      </clipPath>
      
      <g clip-path="url(#alt_clip)">
        <g id="alt_tape" transform="translate(0, 300)">
          <!-- Tick marks generated by JS -->
        </g>
      </g>
      
      <!-- Center pointer -->
      <polygon points="70,280 20,280 0,300 20,320 70,320" fill="black" stroke="cyan" stroke-width="2"/>
      <text id="alt_text" x="45" y="308" fill="white" font-size="20" font-weight="bold" text-anchor="middle">0</text>
    </g>

    <!-- Vertical Speed Indicator (Right of Altitude Tape) -->
    <g id="vsi_group" transform="translate(400, -300)">
      <rect x="0" y="0" width="60" height="600" fill="#333" fill-opacity="0.8"/>

      <clipPath id="vsi_clip">
        <rect x="0" y="0" width="60" height="600"/>
      </clipPath>

      <g clip-path="url(#vsi_clip)">
        <g id="vsi_tape" transform="translate(0, 300)">
          <!-- Tick marks generated by JS -->
        </g>
      </g>

      <!-- Center pointer -->
      <polygon points="50,280 15,280 0,300 15,320 50,320" fill="black" stroke="cyan" stroke-width="2"/>
      <text id="vsi_text" x="25" y="308" fill="white" font-size="14" font-weight="bold" text-anchor="middle">0</text>
    </g>

    <!-- Heading Tape (Bottom) -->
    <g id="hdg_group" transform="translate(-250, 340)">
      <rect x="0" y="0" width="500" height="60" fill="#222"/>
      
      <clipPath id="hdg_clip">
        <rect x="0" y="0" width="500" height="60"/>
      </clipPath>
      
      <g clip-path="url(#hdg_clip)">
        <g id="hdg_tape" transform="translate(250, 0)">
        </g>
      </g>
      
      <!-- Center pointer -->
      <line x1="250" y1="0" x2="250" y2="15" stroke="gold" stroke-width="3"/>
      <rect x="225" y="20" width="50" height="25" fill="black"/>
      <text id="hdg_text" x="250" y="38" fill="gold" font-size="16" font-weight="bold" text-anchor="middle">000</text>
    </g>

    <!-- Per-instrument failure flags: shown when the selected aircraft has stopped sending data -->
    <g id="fail_flags">
      <g id="flag_att" style="display:none">
        <rect x="-150" y="-40" width="300" height="80" fill="red" fill-opacity="0.6"/>
        <text x="0" y="10" fill="white" font-size="28" font-weight="bold" text-anchor="middle">ATT FAIL</text>
      </g>
      <g id="flag_spd" style="display:none" transform="translate(-390, -300)">
        <rect x="0" y="270" width="80" height="60" fill="red" fill-opacity="0.6"/>
        <text x="40" y="308" fill="white" font-size="16" font-weight="bold" text-anchor="middle">SPD</text>
      </g>
      <g id="flag_alt" style="display:none" transform="translate(310, -300)">
        <rect x="0" y="270" width="80" height="60" fill="red" fill-opacity="0.6"/>
        <text x="40" y="308" fill="white" font-size="16" font-weight="bold" text-anchor="middle">ALT</text>
      </g>
      <g id="flag_hdg" style="display:none" transform="translate(-250, 340)">
        <rect x="0" y="0" width="500" height="60" fill="red" fill-opacity="0.6"/>
        <text x="250" y="38" fill="white" font-size="16" font-weight="bold" text-anchor="middle">HDG FAIL</text>
      </g>
    </g>

    <!-- Empty state: shown until the pilot picks a callsign, so first load reads as
         "waiting for input" rather than a frozen instrument sitting at all zeros -->
    <g id="no_aircraft_prompt">
      <rect x="-150" y="-40" width="300" height="80" fill="black" fill-opacity="0.7"/>
      <text x="0" y="10" fill="cyan" font-size="24" font-weight="bold" text-anchor="middle">SELECT AIRCRAFT</text>
    </g>

    <!-- Whole-panel failure banner: shown when the relay WebSocket connection itself is down -->
    <g id="pfd_fail_banner" style="display:none">
      <rect x="-400" y="-400" width="880" height="800" fill="orange" fill-opacity="0.35"/>
      <text x="40" y="0" fill="black" font-size="48" font-weight="bold" text-anchor="middle">PFD FAIL</text>
    </g>
  </svg>
    </main>
  </div>
</div>

<script>

function applyLightingLabels() {
  const mode = document.documentElement.getAttribute("data-theme");
  document.getElementById("dayLabel").classList.toggle("active", mode === "day");
  document.getElementById("nightLabel").classList.toggle("active", mode === "night");
}

function toggleLighting() {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "night" ? "day" : "night";
  root.setAttribute("data-theme", next);
  localStorage.setItem("lighting", next);
  applyLightingLabels();
}

applyLightingLabels();

function setCallsign() {
  activeCallsign = document.getElementById("callsignSelect").value;
  console.log("Tracking:", activeCallsign);

  smoothState.pitch = 0;
  smoothState.roll = 0;
  smoothState.altitude = 0;
  smoothState.groundSpeed = 0;
  smoothState.ias = 0;
  smoothState.verticalSpeed = 0;


  prevSmoothAlt = null;
  for (const key in gpwsMemory) gpwsMemory[key] = false;
  retardPlayed = false;
  // Grace period: don't flag data as stale immediately on selection, only if nothing arrives in time
  lastActiveDataTime = activeCallsign ? Date.now() : null;
}

let activeCallsign = null;
let lastActiveDataTime = null;
let wsConnected = false;
const STALE_DATA_MS = 3000; // ~3x the backend's default 1s update rate

let aircraftState = {
  pitch: 0,
  roll: 0,
  heading: 0,
  altitude: 0,
  groundSpeed: 0,
  ias: 0,
  verticalSpeed: 0
};

let smoothState = {
  pitch: 0,
  roll: 0,
  heading: 0,
  altitude: 0,
  groundSpeed: 0,
  ias: 0,
  verticalSpeed: 0
};

let gpwsMemory = {
  2500: false, 1000: false, 500: false, 400: false, 
  300: false, 200: false, 100: false, 50: false, 
  40: false, 30: false, 20: false, 10: false
};
let prevSmoothAlt = null;
let retardPlayed = false;

function playSound(file) {
  const audio = new Audio(`sounds/${file}`);
  audio.play().catch(e => console.error("Sound play failed:", e));
}

function checkGPWS(currentAlt, currentPitch) {
  if (prevSmoothAlt === null) {
    prevSmoothAlt = currentAlt;
    return;
  }
  
  if (currentAlt > 2600) {
    for (const key in gpwsMemory) gpwsMemory[key] = false;
    retardPlayed = false;
  }

 
  if (currentPitch <= -5) {
    const thresholds = [2500, 1000, 500, 400, 300, 200, 100, 50, 40, 30, 20, 10];
    
    for (let th of thresholds) {
      if (prevSmoothAlt > th && currentAlt <= th && prevSmoothAlt - currentAlt < 500) {
        if (!gpwsMemory[th]) {
          gpwsMemory[th] = true;
          playSound(`${th}.wav`);
        }
      }
    }
    
    // Retard logic
    if (currentAlt <= 25 && currentAlt > 5 && prevSmoothAlt - currentAlt < 500 && !retardPlayed) {
        retardPlayed = true;
        playSound("retard.mp3");
    }
  }

  prevSmoothAlt = currentAlt;
}

const ws = new WebSocket("ws://localhost:8765"); // WS url till backend
ws.onopen = () => {
    console.log("connected to backend");
    wsConnected = true;
};
let knownCallsigns = new Set();
ws.onmessage = (event) => {  // Tar hand om inkommande meddelanden
  const data = JSON.parse(event.data);

  
  const select = document.getElementById("callsignSelect");
  Object.keys(data).forEach(callsign => {
   
    const isLikelyCallsign = /^[A-Z].*-/.test(callsign);
    
    if (
      isLikelyCallsign &&
      typeof data[callsign] === 'object' && 
      data[callsign] !== null &&
      data[callsign].hasOwnProperty('altitude') &&
      !knownCallsigns.has(callsign)
    ) {
      knownCallsigns.add(callsign);
      const opt = document.createElement("option");
      opt.value = callsign;
      opt.textContent = callsign;
      select.appendChild(opt);
    }
  });

  if (!activeCallsign) return;
  if (!data[activeCallsign]) return;

  aircraftState.pitch = data[activeCallsign].pitch || 0;
  aircraftState.roll  = data[activeCallsign].roll || 0;
  aircraftState.altitude = data[activeCallsign].altitude || 0;
  aircraftState.groundSpeed = data[activeCallsign].groundSpeed || 0;
  aircraftState.ias = data[activeCallsign].ias || 0;
  aircraftState.heading = data[activeCallsign].heading || 0;
  // Backend sends vertical speed in feet per second; convert to feet per minute for display
  aircraftState.verticalSpeed = (data[activeCallsign].vertical_speed_fps || 0) * 60;
  lastActiveDataTime = Date.now();
};
ws.onclose = () => {   // Hanterar stängning av anslutning
    console.log("disconnected from backend");
    wsConnected = false;
};
ws.onerror = (err) => {  // loggar om det blir ett fel med WS
  console.error("WS error", err);
  wsConnected = false;
}

let PX_PER_DEG = 5

const attitude = document.getElementById("attitude");

function updateTape(group, value, scale, majorStep, minorStep, isRight) {
  let html = "";
  // Draw major bounds
  let minVal = Math.floor((value - 300 / scale) / majorStep) * majorStep;
  let maxVal = Math.ceil((value + 300 / scale) / majorStep) * majorStep;
  
  for (let v = minVal; v <= maxVal; v += minorStep) {
    if (v < 0 && !isRight) continue; // no negative speed by default

    let y = (value - v) * scale;
    if (y < -300 || y > 300) continue;
    
    let isMajor = (v % majorStep === 0);
    let tickLen = isMajor ? 15 : 8;
    
    if (isRight) {
      // right tape (Altitude)
      html += `<line x1="0" y1="${y}" x2="${tickLen}" y2="${y}" stroke="white" stroke-width="2"/>`;
      if (isMajor) {
        html += `<text x="${tickLen + 5}" y="${y + 6}" fill="white" font-size="16" font-weight="bold">${v}</text>`;
      }
    } else {
      // left tape (Speed)
      html += `<line x1="${80 - tickLen}" y1="${y}" x2="80" y2="${y}" stroke="white" stroke-width="2"/>`;
      if (isMajor) {
        html += `<text x="${80 - tickLen - 5}" y="${y + 6}" fill="white" font-size="16" font-weight="bold" text-anchor="end">${v}</text>`;
      }
    }
  }
  group.innerHTML = html;
}

function updateHdgTape(group, value, scale, majorStep, minorStep) {
  let html = "";
  // Draw major bounds
  let minVal = Math.floor((value - 250 / scale) / minorStep) * minorStep;
  let maxVal = Math.ceil((value + 250 / scale) / minorStep) * minorStep;
  
  for (let v = minVal; v <= maxVal; v += minorStep) {
    let x = (v - value) * scale;
    if (x < -250 || x > 250) continue;
    
    let isMajor = (v % majorStep === 0);
    let tickLen = isMajor ? 12 : 6;
    
    html += `<line x1="${x}" y1="0" x2="${x}" y2="${tickLen}" stroke="white" stroke-width="2"/>`;
    if (isMajor) {
      // Normalize heading to 0-359 interval
      let displayHeading = ((v % 360) + 360) % 360;
      let label = displayHeading;
      if (displayHeading === 0) label = "N";
      else if (displayHeading === 90) label = "E";
      else if (displayHeading === 180) label = "S";
      else if (displayHeading === 270) label = "W";
      else label = String(displayHeading).padStart(3, '0');
      
      html += `<text x="${x}" y="${tickLen + 15}" fill="white" font-size="14" font-weight="bold" text-anchor="middle">${label}</text>`;
    }
  }
  group.innerHTML = html;
}

function update() {
  const pitch_px = smoothState.pitch * PX_PER_DEG;

  // Roll rotation is inverted: a positive (right) bank must rotate the horizon
  // counter-clockwise so the airplane symbol appears banked right relative to it.
  attitude.setAttribute(
    "transform",
    `translate(0, ${pitch_px}) rotate(${-smoothState.roll})`
  );

  // Update speed tape (IAS - indicated airspeed, not groundspeed)
  updateTape(document.getElementById("speed_tape"), smoothState.ias, 3, 20, 10, false);
  document.getElementById("speed_text").textContent = Math.round(smoothState.ias);

  // Update altitude tape (10 units per mark, 100 per text label, scale)
  updateTape(document.getElementById("alt_tape"), smoothState.altitude, 1.5, 100, 20, true);
  document.getElementById("alt_text").textContent = Math.round(smoothState.altitude);

  // Update vertical speed indicator (fpm, 1000 per major mark, 500 per minor mark)
  updateTape(document.getElementById("vsi_tape"), smoothState.verticalSpeed, 0.1, 1000, 500, true);
  const vsiRounded = Math.round(smoothState.verticalSpeed / 50) * 50;
  document.getElementById("vsi_text").textContent = (vsiRounded > 0 ? "+" : "") + vsiRounded;

  // Update heading tape (10 units per mark, 30 per text label, scale)
  updateHdgTape(document.getElementById("hdg_tape"), smoothState.heading, 4, 30, 10);
  let hdgLabel = Math.round(smoothState.heading);
  if (hdgLabel === 360) hdgLabel = 0;
  document.getElementById("hdg_text").textContent = String(hdgLabel).padStart(3, '0');
}

const failFlagIds = ["flag_att", "flag_spd", "flag_alt", "flag_hdg"];

function updateFailFlags() {
  const pfdFailBanner = document.getElementById("pfd_fail_banner");
  const noAircraftPrompt = document.getElementById("no_aircraft_prompt");

  if (!wsConnected) {
    // Relay connection itself is down - nothing on the panel is trustworthy
    pfdFailBanner.style.display = "block";
    noAircraftPrompt.style.display = "none";
    failFlagIds.forEach(id => document.getElementById(id).style.display = "none");
    return;
  }
  pfdFailBanner.style.display = "none";
  noAircraftPrompt.style.display = activeCallsign ? "none" : "block";

  const stale = activeCallsign && lastActiveDataTime !== null &&
    (Date.now() - lastActiveDataTime) > STALE_DATA_MS;
  failFlagIds.forEach(id => document.getElementById(id).style.display = stale ? "block" : "none");
}

// 60 FPS render loop for smooth interpolation
function renderLoop() {
  // Interpolation factor (closer to 1 = faster, closer to 0 = smoother)
  const factor = 0.1;
  smoothState.pitch += (aircraftState.pitch - smoothState.pitch) * factor;
  smoothState.roll += (aircraftState.roll - smoothState.roll) * factor;
  smoothState.altitude += (aircraftState.altitude - smoothState.altitude) * factor;
  smoothState.groundSpeed += (aircraftState.groundSpeed - smoothState.groundSpeed) * factor;
  smoothState.ias += (aircraftState.ias - smoothState.ias) * factor;
  smoothState.verticalSpeed += (aircraftState.verticalSpeed - smoothState.verticalSpeed) * factor;

  // Angular interpolation for heading (handles 0-359 wrap around)
  let hdgDiff = aircraftState.heading - smoothState.heading;
  if (hdgDiff > 180) hdgDiff -= 360;
  if (hdgDiff < -180) hdgDiff += 360;
  smoothState.heading += hdgDiff * factor;
  
  // Normalize smoothState.heading into [0, 360)
  smoothState.heading = ((smoothState.heading % 360) + 360) % 360;

  update();
  checkGPWS(smoothState.altitude, smoothState.pitch);
  updateFailFlags();
  requestAnimationFrame(renderLoop);
}

requestAnimationFrame(renderLoop);

</script>
</body>
</html>
